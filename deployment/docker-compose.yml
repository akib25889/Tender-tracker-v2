version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: tendertracker-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_production_password_2026
      MYSQL_DATABASE: tender_tracker
      MYSQL_USER: tender_user
      MYSQL_PASSWORD: strong_tender_password_2026
    ports:
      - "127.0.0.1:3306:3306" # Bound to localhost only, never exposed to public internet
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tendertracker-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://tender_user:strong_tender_password_2026@mysql:3306/tender_tracker
      STORAGE_ROOT: /app/storage
      SECRET_KEY: tendertracker-command-center-secret-key-2026-v2
    volumes:
      - ../storage:/app/storage # Mounts host HDD/SSD storage directory
      - ../backups:/app/backups # Mounts host backup directory
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: tendertracker-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tendertracker.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/tendertracker/frontend/dist:ro

volumes:
  mysql_data:
