# TenderTracker Command Center - Production Nginx Reverse Proxy Configuration
# Fulfills Backend & Server Specification Sections 46-50

server {
    listen 80;
    listen [::]:80;
    server_name tender-tracker.internal localhost;

    # Redirect all HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Max upload size for large RFP submissions, technical drawings & ZIP files
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8000;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend Static SPA Delivery
    location / {
        root /var/www/tendertracker/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Backend FastAPI Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for large document upload streaming
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # OpenAPI Interactive Swagger Documentation
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/api/openapi.json;
        proxy_set_header Host $host;
    }

    # Strict protection: Never expose storage directory or database directly
    location /storage/ {
        deny all;
        return 404;
    }
}
